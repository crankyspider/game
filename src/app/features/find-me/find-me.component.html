<!-- find-me.component.html -->

<div class="background-blur"></div>

<div class="hack-box-container">
  <div id="grid-container">

    <div id="title-container">
      <img src="/assets/images/gamePad.svg" alt="Title Image">

      <h1>Find Me</h1>

      <p>Reassemble the image.</p>
    </div>

    <div id="grid">
      <div id="main-image-container">

        <h2 id="image-title">Target Location</h2>

        <div
          id="puzzle-board"
          [style.gridTemplateColumns]="'repeat(' + columns + ', 1fr)'"
          [style.gridTemplateRows]="'repeat(' + rows + ', 1fr)'"
        >
          <button
            *ngFor="
              let tile of board;
              let i = index;
              trackBy: trackByIndex
            "
            type="button"
            class="tile"
            [class.empty]="isEmpty(tile)"
            [class.complete]="isComplete"
            [ngStyle]="getTileStyle(tile)"
            (click)="onTileClick(i)"
          >
          </button>
        </div>

        <div id="status-container">
          <p id="status-label">
            Moves: {{ moveCount }}
          </p>

          <p
            id="status-message"
            *ngIf="isComplete"
          >
            ✔ IMAGE RESTORED
          </p>
        </div>

        <button
          type="button"
          class="next"
          (click)="resetPuzzle()"
        >
          SHUFFLE IMAGE
        </button>

      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar">
        <div
          class="progress"
          [style.width.%]="progressPercent"
        ></div>
      </div>
    </div>

  </div>
</div>
